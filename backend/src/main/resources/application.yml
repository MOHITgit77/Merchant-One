server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: shopflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shopflow}
    username: ${DATABASE_USERNAME:shopflow}
    password: ${DATABASE_PASSWORD:shopflow}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

shopflow:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000
  file-storage:
    location: ${FILE_STORAGE_LOCATION:./uploads}
    max-file-size: 5242880
    allowed-types: image/jpeg,image/png,image/webp
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

logging:
  level:
    com.shopflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
