spring:
  datasource:
    url: jdbc:h2:mem:shopflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.shopflow: DEBUG

jwt:
  secret: shopflow-test-secret-key-that-is-at-least-256-bits-long
  expiration: 86400000

file:
  upload:
    dir: target/test-uploads

cors:
  allowed-origins: "*"
