services:
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-db
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopflow-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/shopflow
      DATABASE_USERNAME: shopflow
      DATABASE_PASSWORD: shopflow
      JWT_SECRET: shopflow-dev-secret-key-that-is-at-least-256-bits-long-for-hs256-algo
      FILE_STORAGE_LOCATION: /app/uploads
      CORS_ORIGINS: http://localhost:5175
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopflow-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
